<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>归档 · 小番茄程序猿</title>
  <meta name="description" content="全部技术文章按年份归档。" />
  <link rel="icon" type="image/svg+xml" href="assets/logo.svg" />
  <link rel="alternate" type="application/rss+xml" title="RSS" href="rss.xml" />
  <link rel="stylesheet" href="assets/css/style.css?v=2" />
  <script>
    (function () {
      try {
        var t = localStorage.getItem("theme");
        if (!t) t = window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
        document.documentElement.setAttribute("data-theme", t);
      } catch (e) {}
    })();
  </script>
</head>
<body>
  <header class="nav">
    <div class="wrap nav-inner">
      <a class="brand" href="index.html">
        <img class="logo" src="assets/logo.svg" alt="logo" />
        <span>小番茄程序猿<span class="dot">.</span>dev</span>
      </a>
      <div class="nav-right">
        <nav class="nav-links" id="navLinks">
          <a href="index.html">首页</a>
          <a href="projects.html">项目</a>
          <a href="blog.html">博客</a>
          <a href="deep.html">深度</a>
        </nav>
        <button class="theme-toggle" id="themeToggle" aria-label="切换主题">🌙</button>
        <button class="nav-toggle" id="navToggle" aria-label="菜单">☰</button>
      </div>
    </div>
  </header>

  <main>
    <section class="tool-page">
      <div class="wrap">
        <div class="section-head">
          <div class="kicker">时间线</div>
          <h2>归档</h2>
          <p>全部文章按年份归档，新→旧。</p>
        </div>
        <div id="archiveWrap"><span class="dim-note">加载中…</span></div>
      </div>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <span>© <span id="year"></span> 小番茄程序猿 · 全栈作品集与博客</span>
      <span class="foot-links">
        <a href="tags.html">标签</a> ·
        <a href="search.html">搜索</a> ·
        <a href="rss.xml">RSS</a>
      </span>
    </div>
  </footer>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    var th = document.getElementById("themeToggle");
    function syncThemeIcon(){ th.textContent = document.documentElement.getAttribute("data-theme") === "dark" ? "☀" : "🌙"; }
    syncThemeIcon();
    th.addEventListener("click", function(){
      var nxt = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", nxt);
      try { localStorage.setItem("theme", nxt); } catch(e){}
      syncThemeIcon();
    });
    var t = document.getElementById("navToggle"), l = document.getElementById("navLinks");
    t.addEventListener("click", function(){ l.classList.toggle("open"); });

    function esc(s){ var d = document.createElement("div"); d.textContent = s; return d.innerHTML; }
    fetch("data/archives.json").then(function(r){ return r.json(); }).then(function(groups){
      document.getElementById("archiveWrap").innerHTML = groups.map(function(g){
        var rows = g.items.map(function(a){
          return '<a class="list-row" href="' + esc(a.url) + '">' +
                 '<span class="lr-title">' + esc(a.title) + '</span>' +
                 '<span class="lr-meta">' + esc(a.date) + ' · ' + esc(a.series) + ' 系列</span></a>';
        }).join("");
        return '<div class="year-group"><h3 class="year">' + esc(g.year) +
               ' <i>' + g.items.length + ' 篇</i></h3>' + rows + '</div>';
      }).join("");
    }).catch(function(){
      document.getElementById("archiveWrap").innerHTML = '<span class="dim-note">索引加载失败——请通过本地服务器或 GitHub Pages 访问。</span>';
    });
  </script>
</body>
</html>
