name: Site Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML markdown pygments

      - name: Generate pages
        run: |
          python gen_articles.py
          python gen_deep.py
          python generate_index.py

      - name: Check generated artifacts are committed
        run: |
          if ! git diff --exit-code; then
            echo "::error::生成产物与仓库不一致——请本地运行三个生成脚本后，把变更文件一并提交"
            exit 1
          fi

      - name: Validate site
        run: |
          python verify_titles.py
