name: Site Check

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyYAML markdown pygments

      - name: Generate pages
        run: |
          python gen_articles.py
          python gen_deep.py
          python gen_path.py
          python gen_projects.py
          python generate_index.py

      - name: Check generated artifacts are committed
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::存在未提交的生成产物（含新建文件）——请本地运行三个生成脚本后，把变更与新文件一并提交"
            exit 1
          fi

      - name: Validate site
        run: |
          python verify_titles.py
