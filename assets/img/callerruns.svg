<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <marker id="aB" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#2563eb"/></marker>
    <marker id="aR" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6 Z" fill="#dc2626"/></marker>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="5" flood-color="#000" flood-opacity="0.10"/></filter>
    <style>
      .h{font:bold 30px "Microsoft YaHei",sans-serif;fill:#1f2937}
      .lab{font:bold 19px "Microsoft YaHei",sans-serif;fill:#fff}
      .sm{font:15px "Microsoft YaHei",sans-serif;fill:#6b7280}
      .cap{font:bold 20px "Microsoft YaHei",sans-serif;fill:#0f172a}
      .note{font:16px "Microsoft YaHei",sans-serif;fill:#374151}
      .red{font:bold 18px "Microsoft YaHei",sans-serif;fill:#dc2626}
      .grn{font:bold 18px "Microsoft YaHei",sans-serif;fill:#059669}
    </style>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc"/>
  <text x="600" y="52" text-anchor="middle" class="h">CallerRunsPolicy 是怎么把「异步」变回「同步」的</text>

  <!-- ============ 上半：正常路径 ============ -->
  <rect x="40" y="82" width="1120" height="210" rx="14" fill="#ecfdf5" stroke="#a7f3d0"/>
  <rect x="60" y="98" width="150" height="30" rx="15" fill="#059669"/>
  <text x="135" y="119" text-anchor="middle" class="lab" font-size="15">正常 · 真异步</text>

  <g filter="url(#sh)">
    <rect x="80" y="150" width="180" height="66" rx="10" fill="#0f766e"/>
    <text x="170" y="178" text-anchor="middle" class="lab">Kafka 消费者</text>
    <text x="170" y="200" text-anchor="middle" class="lab" font-size="14">提交 3~4 个任务</text>
  </g>
  <path d="M265 183 L355 183" stroke="#059669" stroke-width="3" marker-end="url(#aB)"/>
  <g filter="url(#sh)">
    <rect x="360" y="140" width="270" height="86" rx="10" fill="#10b981"/>
    <text x="495" y="172" text-anchor="middle" class="lab">taskExecutor</text>
    <text x="495" y="198" text-anchor="middle" class="lab" font-size="15">16 线程有空闲 · 队列未满</text>
  </g>
  <path d="M635 183 L725 183" stroke="#059669" stroke-width="3" marker-end="url(#aB)"/>
  <g filter="url(#sh)">
    <rect x="730" y="140" width="200" height="86" rx="10" fill="#34d399"/>
    <text x="830" y="172" text-anchor="middle" class="lab">异步写入 4 存储</text>
    <text x="830" y="198" text-anchor="middle" class="lab" font-size="15">Redis / ES / Mongo</text>
  </g>
  <text x="960" y="168" class="grn">消费者线程</text>
  <text x="960" y="192" class="grn">立刻返回</text>
  <text x="960" y="216" class="sm">→ 继续拉下一批</text>

  <!-- ============ 下半：退化路径 ============ -->
  <rect x="40" y="312" width="1120" height="250" rx="14" fill="#fef2f2" stroke="#fecaca"/>
  <rect x="60" y="328" width="180" height="30" rx="15" fill="#dc2626"/>
  <text x="150" y="349" text-anchor="middle" class="lab" font-size="15">高负载 · 静默退化</text>

  <g filter="url(#sh)">
    <rect x="80" y="378" width="200" height="72" rx="10" fill="#f59e0b"/>
    <text x="180" y="406" text-anchor="middle" class="lab">I/O 密集型任务</text>
    <text x="180" y="430" text-anchor="middle" class="lab" font-size="14">线程等网络，不释放</text>
  </g>
  <path d="M285 414 L355 414" stroke="#dc2626" stroke-width="3" marker-end="url(#aR)"/>

  <g filter="url(#sh)">
    <rect x="360" y="378" width="200" height="72" rx="10" fill="#ef4444"/>
    <text x="460" y="406" text-anchor="middle" class="lab">16 线程全忙</text>
    <text x="460" y="430" text-anchor="middle" class="lab" font-size="14">queue(1000) 打满</text>
  </g>
  <path d="M565 414 L635 414" stroke="#dc2626" stroke-width="3" marker-end="url(#aR)"/>

  <g filter="url(#sh)">
    <rect x="640" y="378" width="220" height="72" rx="10" fill="#b91c1c"/>
    <text x="750" y="406" text-anchor="middle" class="lab">CallerRuns 触发</text>
    <text x="750" y="430" text-anchor="middle" class="lab" font-size="14">任务退回调用线程</text>
  </g>
  <path d="M865 414 L935 414" stroke="#dc2626" stroke-width="3" marker-end="url(#aR)"/>

  <g filter="url(#sh)">
    <rect x="940" y="378" width="200" height="72" rx="10" fill="#7f1d1d"/>
    <text x="1040" y="406" text-anchor="middle" class="lab">消费者亲自写</text>
    <text x="1040" y="430" text-anchor="middle" class="lab" font-size="14">同步阻塞 10~30ms</text>
  </g>

  <text x="80" y="482" class="red">↓ 恶性循环</text>
  <text x="80" y="510" class="note">消费者被阻塞 → RingBuffer 释放变慢 → Producer 端反压 → 整体 QPS 下跌 → 下一批任务继续堆积……</text>
  <text x="80" y="540" class="note">全程<b>没有一行异常日志</b>：你以为是异步，实际是「同步 + 线程调度开销」双份成本</text>

  <!-- 底部结论 -->
  <rect x="40" y="580" width="1120" height="66" rx="12" fill="#0f172a"/>
  <text x="600" y="620" text-anchor="middle" style="font:bold 21px 'Microsoft YaHei';fill:#f9fafb">实测：4 个异步任务减到 3 个（MySQL 改回同步），中位 QPS 7,387 → 10,171（+38%）· B 队列打满、CallerRuns 367~448 次，C 全程 0</text>
</svg>
