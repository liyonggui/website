<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
  <defs>
    <style>
      .title { font: bold 34px "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .panel-label { font: bold 26px "Microsoft YaHei", sans-serif; }
      .box-label { font: bold 20px "Microsoft YaHei", sans-serif; fill: #ffffff; }
      .sub { font: 15px "Microsoft YaHei", sans-serif; fill: #6b7280; }
      .caption-t { font: bold 22px "Microsoft YaHei", sans-serif; fill: #1f2937; }
      .caption { font: 17px "Microsoft YaHei", sans-serif; fill: #374151; }
      .foot { font: 16px "Microsoft YaHei", sans-serif; fill: #9ca3af; }
    </style>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="1200" height="675" fill="#f8fafc"/>

  <!-- 标题 -->
  <text x="600" y="66" text-anchor="middle" class="title">String 的两种内存布局：1 次 malloc vs 2 次 malloc</text>

  <!-- ================= 左：embstr ================= -->
  <g filter="url(#shadow)">
    <rect x="60" y="120" width="500" height="360" rx="16" fill="#ffffff"/>
  </g>
  <text x="310" y="175" text-anchor="middle" class="panel-label" fill="#059669">embstr（≤ 44 字节）</text>

  <!-- 连续内存块 -->
  <g>
    <rect x="95" y="215" width="150" height="70" rx="8" fill="#059669"/>
    <text x="170" y="243" text-anchor="middle" class="box-label">RedisObject</text>
    <text x="170" y="268" text-anchor="middle" class="box-label" font-size="14">头信息</text>

    <rect x="245" y="215" width="90" height="70" rx="8" fill="#10b981"/>
    <text x="290" y="243" text-anchor="middle" class="box-label">sds 头</text>
    <text x="290" y="268" text-anchor="middle" class="box-label" font-size="14">len/alloc</text>

    <rect x="335" y="215" width="190" height="70" rx="8" fill="#34d399"/>
    <text x="430" y="243" text-anchor="middle" class="box-label">数据</text>
    <text x="430" y="268" text-anchor="middle" class="box-label" font-size="16">"hello"</text>
  </g>

  <!-- 一次 malloc 标注 -->
  <path d="M 95 335 L 525 335" stroke="#059669" stroke-width="3" marker-end="url(#arrowG)"/>
  <rect x="215" y="352" width="190" height="40" rx="20" fill="#d1fae5"/>
  <text x="310" y="379" text-anchor="middle" font="bold 18px" style="font: bold 18px 'Microsoft YaHei'; fill:#065f46">1 次 malloc</text>
  <text x="310" y="428" text-anchor="middle" class="caption">连续内存块 · cache 命中率高</text>

  <!-- ================= 右：raw ================= -->
  <g filter="url(#shadow)">
    <rect x="640" y="120" width="500" height="360" rx="16" fill="#ffffff"/>
  </g>
  <text x="890" y="175" text-anchor="middle" class="panel-label" fill="#d97706">raw（&gt; 44 字节）</text>

  <!-- 两块分离内存：malloc#1 = RedisObject；malloc#2 = sds头+数据（连续） -->
  <g>
    <rect x="700" y="215" width="150" height="70" rx="8" fill="#d97706"/>
    <text x="775" y="243" text-anchor="middle" class="box-label">RedisObject</text>
    <text x="775" y="268" text-anchor="middle" class="box-label" font-size="14">头信息 + 指针</text>

    <path d="M 850 250 L 930 250" stroke="#b45309" stroke-width="3" marker-end="url(#arrowO)"/>

    <rect x="935" y="215" width="90" height="70" rx="8" fill="#f59e0b"/>
    <text x="980" y="243" text-anchor="middle" class="box-label">sds 头</text>
    <text x="980" y="268" text-anchor="middle" class="box-label" font-size="14">len/alloc</text>

    <rect x="1025" y="215" width="80" height="70" rx="8" fill="#fbbf24"/>
    <text x="1065" y="243" text-anchor="middle" class="box-label">数据</text>
    <text x="1065" y="268" text-anchor="middle" class="box-label" font-size="13">&gt; 44B</text>
  </g>

  <!-- 两次 malloc 标注 -->
  <path d="M 700 455 L 1115 455" stroke="#d97706" stroke-width="3"/>
  <circle cx="700" cy="250" r="5" fill="#b45309"/>
  <text x="907" y="443" text-anchor="middle" class="caption" fill="#92400e">malloc ①：RedisObject　·　malloc ②：sds 头 + 数据（连续）</text>
  <rect x="795" y="472" width="190" height="40" rx="20" fill="#fef3c7"/>
  <text x="890" y="499" text-anchor="middle" style="font: bold 18px 'Microsoft YaHei'; fill:#92400e">2 次 malloc</text>

  <!-- ================= 底部结论条 ================= -->
  <g filter="url(#shadow)">
    <rect x="60" y="520" width="1080" height="100" rx="16" fill="#0f172a"/>
  </g>
  <text x="600" y="560" text-anchor="middle" style="font: bold 20px 'Microsoft YaHei'; fill:#f9fafb">实测结论（Redis 7 · Lettuce Pipeline · 45 万 QPS 压测）</text>
  <text x="600" y="596" text-anchor="middle" style="font: 18px 'Microsoft YaHei'; fill:#a5f3fc">embstr vs raw：SET 快 25.3% · GET 快 14.2% · 但 embstr 只读，反复 APPEND 触发重分配，max 延迟 287ms vs 39ms</text>

  <text x="600" y="652" text-anchor="middle" class="foot">来源：高并发实测系列 · 场景 11（INT / EMBSTR / RAW 12 轮对比）</text>

  <defs>
    <marker id="arrowG" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#059669"/>
    </marker>
    <marker id="arrowO" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#b45309"/>
    </marker>
  </defs>
</svg>
