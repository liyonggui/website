<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675">
<rect width="1200" height="675" fill="#f8fafc"/>
<text x="600" y="48" text-anchor="middle" style="font:bold 28px 'Microsoft YaHei';fill:#1f2937">工具层加一层缓存：p95 从 836ms 掉到 12.34ms</text>
<text x="600" y="80" text-anchor="middle" style="font:16px 'Microsoft YaHei';fill:#6b7280">同一台机器 · 同一份 k6 脚本（开环 100/s × 20s，5 城市热点集）· 两栏同一纵轴刻度</text>

<g stroke="#e5e7eb"><path d="M100 560 H1140 M100 505 H1140 M100 445 H1140 M100 335 H1140 M100 225 H1140 M100 115 H1140"/></g>
<g style="font:15px 'Microsoft YaHei';fill:#9ca3af" text-anchor="end"><text x="92" y="565">0</text><text x="92" y="510">250</text><text x="92" y="450">500</text><text x="92" y="340">1000</text><text x="92" y="230">1500</text><text x="92" y="120">2000</text></g>
<text x="108" y="105" style="font:14px 'Microsoft YaHei';fill:#9ca3af">延迟（ms）</text>

<path d="M100 505 H1140" stroke="#ef4444" stroke-width="2" stroke-dasharray="8 6"/>
<text x="605" y="498" text-anchor="middle" style="font:bold 15px 'Microsoft YaHei';fill:#ef4444">阈值 p95 &lt; 250ms</text>

<text x="340" y="140" text-anchor="middle" style="font:bold 22px 'Microsoft YaHei';fill:#374151">A · 无缓存</text>
<text x="900" y="140" text-anchor="middle" style="font:bold 22px 'Microsoft YaHei';fill:#374151">B · Caffeine 缓存开</text>

<rect x="180" y="559" width="70" height="1.1" fill="#94a3b8"/>
<text x="215" y="550" text-anchor="middle" style="font:15px 'Microsoft YaHei';fill:#6b7280">med 5.2</text>
<rect x="290" y="376" width="70" height="184" fill="#ef4444"/>
<text x="325" y="366" text-anchor="middle" style="font:bold 17px 'Microsoft YaHei';fill:#ef4444">p95 836</text>
<rect x="400" y="140" width="70" height="420" fill="#cbd5e1"/>
<text x="435" y="130" text-anchor="middle" style="font:15px 'Microsoft YaHei';fill:#6b7280">max 1910</text>
<text x="325" y="600" text-anchor="middle" style="font:16px 'Microsoft YaHei';fill:#9ca3af">2000 次全部回源</text>

<rect x="740" y="560" width="70" height="0.4" fill="#94a3b8"/>
<text x="775" y="550" text-anchor="middle" style="font:15px 'Microsoft YaHei';fill:#6b7280">med 1.9</text>
<rect x="850" y="557" width="70" height="3" fill="#10b981"/>
<text x="885" y="547" text-anchor="middle" style="font:bold 17px 'Microsoft YaHei';fill:#10b981">p95 12.34</text>
<rect x="960" y="411" width="70" height="149" fill="#cbd5e1"/>
<text x="995" y="401" text-anchor="middle" style="font:15px 'Microsoft YaHei';fill:#6b7280">max 676</text>
<text x="885" y="600" text-anchor="middle" style="font:16px 'Microsoft YaHei';fill:#9ca3af">hit 1954 / miss 46（命中率 97.7%）</text>

<path d="M330 300 C520 250 700 400 852 540" stroke="#10b981" stroke-width="3" fill="none" marker-end="url(#a)"/>
<defs><marker id="a" markerWidth="12" markerHeight="12" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#10b981"/></marker></defs>
<text x="600" y="270" text-anchor="middle" style="font:bold 26px 'Microsoft YaHei';fill:#10b981">↓ 98.5%</text>
<text x="600" y="300" text-anchor="middle" style="font:17px 'Microsoft YaHei';fill:#10b981">约 68 倍</text>

<text x="600" y="648" text-anchor="middle" style="font:17px 'Microsoft YaHei';fill:#374151">缓存没让任何一次下游调用变快——它把 97.7% 的调用消灭了。max 676ms 是冷启动 / 过期穿透。</text>
</svg>
